name: Auto Pull Request to Main

on:
  push:
    branches-ignore:
      - main
  # Permite execução manual caso o trigger automático falhe
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "Branch: $BRANCH"

          # Verifica se já existe um Pull Request aberto desta branch para a main
          PR_EXISTS=$(gh pr list --head "$BRANCH" --base main --json number --jq 'length')

          if [ "$PR_EXISTS" -eq 0 ]; then
            echo "Nenhum Pull Request aberto encontrado. Criando PR da branch $BRANCH para a main..."
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Merge $BRANCH into main" \
              --body "Este Pull Request foi gerado automaticamente pelo workflow de Auto PR ao receber um push na branch \`$BRANCH\`."
          else
            echo "Já existe um Pull Request aberto para a branch $BRANCH. Ignorando criação."
          fi
